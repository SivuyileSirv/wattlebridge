
name: wattlebridge

services:
  db:
    image: mariadb:12.3
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - backend

  wordpress:
    image: wordpress:php8.5-apache
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:?DB_NAME is required}
      WORDPRESS_DB_USER: ${DB_USER:?DB_USER is required}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);

    volumes:
      - wordpress_data:/var/www/html
      - ./app/wp-content/themes/wattlebridge:/var/www/html/wp-content/themes/wattlebridge

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  wordpress_data:
